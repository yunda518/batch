name: build

# 推送 v* 标签或手动触发时，分别在各自原生系统上打包，避免跨平台原生依赖问题。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Windows .exe
        # 默认产出未签名 exe。需要签名时在仓库 Secrets 配 WIN_CSC_LINK /
        # WIN_CSC_KEY_PASSWORD，并在此处补回对应 env（空值会导致路径解析报错）。
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            release/*.exe
            release/*.blockmap

  mac:
    strategy:
      fail-fast: false   # 一个架构失败不取消另一个，便于分别拿产物/排错
      matrix:
        include:
          - os: macos-13   # Intel
            arch: x64
          - os: macos-14   # Apple Silicon
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Mac .dmg (${{ matrix.arch }})
        env:
          # 默认产出未签名 dmg（可靠）。空的 CSC_LINK 会被 electron-builder 当成
          # 文件路径解析而报 "not a file"，故此处不传空证书变量，只关掉签名发现。
          # 需要签名+公证时：配置 MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD / APPLE_ID /
          # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 这几个 Secrets，并把下面
          # CSC_IDENTITY_AUTO_DISCOVERY 改为 true、补回对应 env。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.blockmap
